version: "2"
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        no-terraform:
          deny:
            - pkg: github.com/hashicorp/terraform-plugin-framework
              desc: go-adpwsh must not depend on Terraform
            - pkg: github.com/hashicorp/terraform-plugin-go
              desc: go-adpwsh must not depend on Terraform
            - pkg: github.com/hashicorp/terraform-plugin-log
              desc: use the Logger output port instead
